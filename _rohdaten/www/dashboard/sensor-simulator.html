<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sensor Simulator & Steuerung</title>
  <!-- FontAwesome Icons CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    /* Reset & Base Settings */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #0f172a;
      background-image: 
        radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 0%, rgba(139, 92, 246, 0.15) 0px, transparent 50%),
        radial-gradient(at 50% 100%, rgba(236, 72, 153, 0.12) 0px, transparent 50%);
      background-attachment: fixed;
      color: #f8fafc;
      padding: 16px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 1000px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Glassmorphism Style */
    .glass {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    /* Navigation Bar */
    .nav-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
    }

    .back-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #38bdf8;
      text-decoration: none;
      font-weight: 500;
      font-size: 0.9rem;
      padding: 8px 14px;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.2);
      border-radius: 10px;
      transition: all 0.2s ease;
    }

    .back-btn:hover {
      background: rgba(56, 189, 248, 0.2);
      transform: translateX(-2px);
    }

    .status-badge {
      font-size: 0.75rem;
      padding: 6px 12px;
      border-radius: 20px;
      font-family: monospace;
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.08);
      color: #94a3b8;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #64748b;
    }

    .status-dot.active {
      background-color: #4ade80;
      box-shadow: 0 0 8px #4ade80;
    }

    .status-dot.error {
      background-color: #f87171;
    }

    /* Grid Layout */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
    }

    /* Sensor Control Card */
    .sensor-card {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: #cbd5e1;
      display: flex;
      align-items: center;
      gap: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .card-value {
      font-size: 1.5rem;
      font-weight: 700;
      font-family: monospace;
      color: #f8fafc;
    }

    /* Range Sliders */
    .slider-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    input[type=range] {
      -webkit-appearance: none;
      width: 100%;
      background: rgba(255, 255, 255, 0.1);
      height: 8px;
      border-radius: 4px;
      outline: none;
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #38bdf8;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
      transition: transform 0.1s ease;
    }

    input[type=range]::-webkit-slider-thumb:hover {
      transform: scale(1.15);
    }

    .range-limits {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: #64748b;
      font-family: monospace;
    }

    /* Preset Buttons */
    .presets {
      display: flex;
      gap: 8px;
    }

    .preset-btn {
      flex: 1;
      padding: 6px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      color: #cbd5e1;
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .preset-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }

    /* Visual Bars */
    .progress-bg {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      transition: width 0.15s ease;
    }

    /* Accent Colors */
    .temp-color { color: #f97316; }
    .temp-bg { background: linear-gradient(90deg, #38bdf8, #f97316); }

    .humidity-color { color: #38bdf8; }
    .humidity-bg { background: #38bdf8; }

    .light-color { color: #facc15; }
    .light-bg { background: #facc15; }

    .dist-color { color: #a855f7; }
    .dist-bg { background: #a855f7; }

    /* Schematic Remote Control Card */
    .remote-card {
      grid-column: 1 / -1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px;
    }

    .remote-casing {
      width: 100%;
      max-width: 340px;
      background: rgba(15, 23, 42, 0.6);
      border: 2px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 20px;
      box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.5), 0 10px 30px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      gap: 16px;
      align-items: center;
    }

    .remote-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .remote-led {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #334155;
      transition: background 0.2s, box-shadow 0.2s;
    }

    .remote-led.blink {
      background: #ef4444;
      box-shadow: 0 0 10px #ef4444;
    }

    .remote-power-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      width: 100%;
    }

    .btn-power {
      padding: 12px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.15s ease;
    }

    .btn-power.on {
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
      border-color: rgba(74, 222, 128, 0.3);
    }

    .btn-power.on:hover {
      background: rgba(34, 197, 94, 0.3);
    }

    .btn-power.off {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border-color: rgba(248, 113, 113, 0.3);
    }

    .btn-power.off:hover {
      background: rgba(239, 68, 68, 0.3);
    }

    .remote-numpad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      width: 100%;
    }

    .btn-num {
      aspect-ratio: 1;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #f8fafc;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    }

    .btn-num:hover {
      background: rgba(255, 255, 255, 0.18);
      transform: translateY(-2px);
    }

    .btn-num:active, .btn-power:active, .btn-reset:active {
      transform: scale(0.95);
    }

    .btn-num.active, .btn-power.active {
      border-color: #38bdf8;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.6);
      background: rgba(56, 189, 248, 0.25);
    }

    .btn-reset {
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #94a3b8;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-reset:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #cbd5e1;
    }

    .current-ir-display {
      font-size: 0.85rem;
      color: #94a3b8;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .current-ir-value {
      color: #38bdf8;
      font-weight: 700;
      font-family: monospace;
    }

    @media (max-width: 600px) {
      body {
        padding: 10px;
      }
      .grid {
        grid-template-columns: 1fr;
      }
      .remote-card {
        padding: 16px 12px;
      }
    }
  </style>
</head>
<body>

  <div class="container">

    <!-- Top Navigation Bar -->
    <div class="glass nav-bar">
      <a href="http://10.0.0.1" class="back-btn">
        <i class="fa-solid fa-arrow-left"></i> Smarthome Server
      </a>
      <div class="status-badge">
        <div class="status-dot" id="statusDot"></div>
        <span id="statusText">Bereit</span>
      </div>
    </div>

    <!-- Main Sensors Grid -->
    <div class="grid">

      <!-- 1. Temperatur -->
      <div class="glass sensor-card">
        <div class="card-header">
          <div class="card-title">
            <i class="fa-solid fa-temperature-half temp-color"></i> Temperatur
          </div>
          <div class="card-value"><span id="valTemp">22.5</span> <span style="font-size:0.9rem; color:#94a3b8;">°C</span></div>
        </div>

        <div class="progress-bg">
          <div class="progress-fill temp-bg" id="barTemp" style="width: 50%;"></div>
        </div>

        <div class="slider-container">
          <input type="range" id="inputTemp" min="-10" max="40" step="0.5" value="22.5" oninput="updateUI(); triggerUpdate();">
          <div class="range-limits">
            <span>-10°C</span>
            <span>+40°C</span>
          </div>
        </div>

        <div class="presets">
          <button class="preset-btn" onclick="setTemp(18.0)">18° (Kalt)</button>
          <button class="preset-btn" onclick="setTemp(21.5)">21.5° (Soll)</button>
          <button class="preset-btn" onclick="setTemp(28.0)">28° (Warm)</button>
        </div>
      </div>

      <!-- 2. Luftfeuchtigkeit -->
      <div class="glass sensor-card">
        <div class="card-header">
          <div class="card-title">
            <i class="fa-solid fa-droplet humidity-color"></i> Luftfeuchtigkeit
          </div>
          <div class="card-value"><span id="valHum">45</span> <span style="font-size:0.9rem; color:#94a3b8;">%</span></div>
        </div>

        <div class="progress-bg">
          <div class="progress-fill humidity-bg" id="barHum" style="width: 45%;"></div>
        </div>

        <div class="slider-container">
          <input type="range" id="inputHum" min="0" max="100" step="1" value="45" oninput="updateUI(); triggerUpdate();">
          <div class="range-limits">
            <span>0%</span>
            <span>100%</span>
          </div>
        </div>

        <div class="presets">
          <button class="preset-btn" onclick="setHum(30)">30% (Trocken)</button>
          <button class="preset-btn" onclick="setHum(50)">50% (Optimal)</button>
          <button class="preset-btn" onclick="setHum(80)">80% (Feucht)</button>
        </div>
      </div>

      <!-- 3. Lichtstärke -->
      <div class="glass sensor-card">
        <div class="card-header">
          <div class="card-title">
            <i class="fa-solid fa-sun light-color"></i> Lichtstärke
          </div>
          <div class="card-value"><span id="valLight">75</span> <span style="font-size:0.9rem; color:#94a3b8;">%</span></div>
        </div>

        <div class="progress-bg">
          <div class="progress-fill light-bg" id="barLight" style="width: 75%;"></div>
        </div>

        <div class="slider-container">
          <input type="range" id="inputLight" min="0" max="100" step="1" value="75" oninput="updateUI(); triggerUpdate();">
          <div class="range-limits">
            <span>0% (Dunkel)</span>
            <span>100% (Hell)</span>
          </div>
        </div>

        <div class="presets">
          <button class="preset-btn" onclick="setLight(0)">0% (Nacht)</button>
          <button class="preset-btn" onclick="setLight(50)">50% (Bewölkt)</button>
          <button class="preset-btn" onclick="setLight(100)">100% (Sonne)</button>
        </div>
      </div>

      <!-- 4. Entfernung -->
      <div class="glass sensor-card">
        <div class="card-header">
          <div class="card-title">
            <i class="fa-solid fa-ruler-horizontal dist-color"></i> Entfernung
          </div>
          <div class="card-value"><span id="valDist">120</span> <span style="font-size:0.9rem; color:#94a3b8;">cm</span></div>
        </div>

        <div class="progress-bg">
          <div class="progress-fill dist-bg" id="barDist" style="width: 30%;"></div>
        </div>

        <div class="slider-container">
          <input type="range" id="inputDist" min="0" max="400" step="5" value="120" oninput="updateUI(); triggerUpdate();">
          <div class="range-limits">
            <span>0 cm</span>
            <span>400 cm</span>
          </div>
        </div>

        <div class="presets">
          <button class="preset-btn" onclick="setDist(20)">20 cm (Nah)</button>
          <button class="preset-btn" onclick="setDist(150)">150 cm (Mittel)</button>
          <button class="preset-btn" onclick="setDist(350)">350 cm (Fern)</button>
        </div>
      </div>

      <!-- 5. IR-Fernbedienung (Schematisch) -->
      <div class="glass sensor-card remote-card">
        <div class="card-title" style="margin-bottom: 12px;">
          <i class="fa-solid fa-tower-broadcast temp-color"></i> IR-Fernbedienung Simulation
        </div>

        <div class="remote-casing">
          <div class="remote-header">
            <span style="font-size:0.75rem; color:#64748b; font-weight:bold; letter-spacing:1px;">REMOTE CONTROL</span>
            <div class="remote-led" id="remoteLed"></div>
          </div>

          <!-- Ein / Aus -->
          <div class="remote-power-row">
            <button class="btn-power on" onclick="sendIR('Ein')">
              <i class="fa-solid fa-power-off"></i> EIN
            </button>
            <button class="btn-power off" onclick="sendIR('Aus')">
              <i class="fa-solid fa-power-off"></i> AUS
            </button>
          </div>

          <!-- Tasten 0 - 9 -->
          <div class="remote-numpad">
            <button class="btn-num" onclick="sendIR('1')">1</button>
            <button class="btn-num" onclick="sendIR('2')">2</button>
            <button class="btn-num" onclick="sendIR('3')">3</button>
            <button class="btn-num" onclick="sendIR('4')">4</button>
            <button class="btn-num" onclick="sendIR('5')">5</button>
            <button class="btn-num" onclick="sendIR('6')">6</button>
            <button class="btn-num" onclick="sendIR('7')">7</button>
            <button class="btn-num" onclick="sendIR('8')">8</button>
            <button class="btn-num" onclick="sendIR('9')">9</button>
            <div style="visibility:hidden;"></div>
            <button class="btn-num" onclick="sendIR('0')">0</button>
            <div style="visibility:hidden;"></div>
          </div>

          <!-- Signal Zurücksetzen -->
          <button class="btn-reset" onclick="sendIR('kein_signal')">
            <i class="fa-solid fa-rotate-left"></i> Signal zurücksetzen (kein_signal)
          </button>
        </div>

        <div class="current-ir-display">
          Aktuelles IR-Signal: <span class="current-ir-value" id="valIR">kein_signal</span>
        </div>
      </div>

    </div>

  </div>

  <script>
    // System Configurations
    const API_BASE = "http://10.0.0.1:3000/api/sensor";
    let currentIR = "kein_signal";
    let updateTimeout = null;

    // Element References
    const inputTemp = document.getElementById('inputTemp');
    const inputHum = document.getElementById('inputHum');
    const inputLight = document.getElementById('inputLight');
    const inputDist = document.getElementById('inputDist');

    const valTemp = document.getElementById('valTemp');
    const valHum = document.getElementById('valHum');
    const valLight = document.getElementById('valLight');
    const valDist = document.getElementById('valDist');
    const valIR = document.getElementById('valIR');

    const barTemp = document.getElementById('barTemp');
    const barHum = document.getElementById('barHum');
    const barLight = document.getElementById('barLight');
    const barDist = document.getElementById('barDist');

    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const remoteLed = document.getElementById('remoteLed');

    // Sync UI Displays with Slider Inputs
    function updateUI() {
      valTemp.textContent = parseFloat(inputTemp.value).toFixed(1);
      valHum.textContent = inputHum.value;
      valLight.textContent = inputLight.value;
      valDist.textContent = inputDist.value;
      valIR.textContent = currentIR;

      // Progress bar calculations
      barTemp.style.width = (((inputTemp.value - (-10)) / 50) * 100) + '%';
      barHum.style.width = inputHum.value + '%';
      barLight.style.width = inputLight.value + '%';
      barDist.style.width = ((inputDist.value / 400) * 100) + '%';
    }

    // Set Helper Functions for Presets
    function setTemp(v) { inputTemp.value = v; updateUI(); triggerUpdate(); }
    function setHum(v) { inputHum.value = v; updateUI(); triggerUpdate(); }
    function setLight(v) { inputLight.value = v; updateUI(); triggerUpdate(); }
    function setDist(v) { inputDist.value = v; updateUI(); triggerUpdate(); }

    function sendIR(code) {
      currentIR = code;
      updateUI();
      
      // Blink Remote Control LED
      remoteLed.classList.add('blink');
      setTimeout(() => remoteLed.classList.remove('blink'), 250);

      triggerUpdate(true); // Send instantly on button press
    }

    // Debounce method so moving sliders doesn't spam the network
    function triggerUpdate(immediate = false) {
      if (updateTimeout) clearTimeout(updateTimeout);

      if (immediate) {
        sendDataToBackend();
      } else {
        updateTimeout = setTimeout(sendDataToBackend, 250);
      }
    }

    // Send values to backend: GET http://10.0.0.1:3000/api/sensor/update?...
    async function sendDataToBackend() {
      const params = new URLSearchParams({
        temperatur: inputTemp.value,
        luftfeuchtigkeit: inputHum.value,
        lichtstaerke: inputLight.value,
        entfernung: inputDist.value,
        ir: currentIR
      });

      const url = `${API_BASE}/update?${params.toString()}`;

      try {
        statusText.textContent = "Sende...";
        statusDot.className = "status-dot";

        const res = await fetch(url, { method: 'GET' });
        
        if (res.ok) {
          statusText.textContent = "Gesendet";
          statusDot.className = "status-dot active";
        } else {
          statusText.textContent = `Fehler (${res.status})`;
          statusDot.className = "status-dot error";
        }
      } catch (err) {
        console.warn("API Server unreachable:", err);
        statusText.textContent = "Offline / Simulation";
        statusDot.className = "status-dot error";
      }
    }

    // Fetch initial state from server on startup
    async function fetchInitialData() {
      try {
        const res = await fetch(`${API_BASE}/temperatur`);
        if (res.ok) {
          const data = await res.json();
          if (data.temperatur !== undefined) inputTemp.value = data.temperatur;
          if (data.luftfeuchtigkeit !== undefined) inputHum.value = data.luftfeuchtigkeit;
          if (data.lichtstaerke !== undefined) inputLight.value = data.lichtstaerke;
          if (data.entfernung !== undefined) inputDist.value = data.entfernung;
          if (data.ir !== undefined) currentIR = data.ir;
          
          statusText.textContent = "Synchronisiert";
          statusDot.className = "status-dot active";
        }
      } catch (e) {
        console.log("Konnte Daten nicht vom Server laden. Verwende Standardwerte.");
        statusText.textContent = "Bereit (Bereich offline)";
      } finally {
        updateUI();
      }
    }

    // Initialize Page
    window.addEventListener('DOMContentLoaded', () => {
      fetchInitialData();
    });
  </script>
</body>
</html>
